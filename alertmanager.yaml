global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'discord-slack-receiver'

receivers:
- name: 'discord-slack-receiver'
  slack_configs:
  - api_url: 'https://discord.com/api/webhooks/1562660253210771459/qq-mGbzCxqdS4ukFJH5Nx1_plSOvjhS4pTcCn_oqttkwRV04_7LzqRUavYC3taw2O-yZ/slack' # <-- Notice the "/slack" suffix at the very end
    send_resolved: true
    username: 'OpenShift Alertmanager'
    channel: '#ignored-by-discord' # This field is mandatory for the schema but ignored by Discord
    icon_emoji: ':warning:'
    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    text: '{{ template "slack.default.text" . }}'
