apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: local-block-set
  namespace: openshift-local-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/master
            operator: Exists
  storageClassName: local-block
  volumeMode: Block
  # Maximum number of matching devices the operator is allowed to claim per node
  maxDeviceCount: 1
  # The strict schema-compliant filtering mechanism for v1alpha1
  deviceInclusionSpec:
    deviceTypes:
      - disk
    deviceMechanicalProperties:
      - NonRotational
    # Targets your 2TB drives by bounding the size lookup parameters
    minSize: 1800Gi
    maxSize: 2000Gi
    # Matches the string identifier from your NVMe controller firmware
    models:
      - WD_BLACK_SN7100_2TB
