apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: local-block-set
  namespace: openshift-local-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/master
            operator: Exists
  storageClassName: local-block
  volumeMode: Block
  # Strictly limits the operator to claiming exactly ONE disk per master node
  maxDeviceCount: 1
  deviceInclusionSpec:
    deviceTypes:
      - disk
    deviceMechanicalProperties:
      - NonRotational
    # Broadened to safely capture your 1863Gi (2TB) NVMe drives
    minSize: 1500Gi
    maxSize: 2500Gi
