apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  annotations:
    cdi.kubevirt.io/minimumSupportedPvcSize: 1Gi
  name: synology-smb-storage
spec: 
  claimPropertySets:
  - accessModes:
    - ReadWriteMany
    volumeMode: Filesystem
  - accessModes:
    - ReadWriteOnce
    volumeMode: Filesystem