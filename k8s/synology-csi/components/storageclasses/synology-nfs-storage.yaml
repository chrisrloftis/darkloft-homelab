apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-nfs-storage
parameters:
  dsm: 192.168.3.165
  location: /volume1
  protocol: nfs
  permissions: "0777" 
provisioner: csi.san.synology.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - sec=sys
  - rw
  - lookupcache=none