apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-nfs-storage
provisioner: csi.san.synology.com
parameters:
  protocol: "nfs"
  dsm: '192.168.3.165'
  location: "/volume1"
  csi.storage.k8s.io/node-stage-secret-name: "client-info-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "synology-csi"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1