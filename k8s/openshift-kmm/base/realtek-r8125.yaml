apiVersion: kmm.sigs.x-k8s.io/v1beta1
kind: Module
metadata:
  name: realtek-r8125
  namespace: openshift-kmm
spec:
  registryTLS:
    insecureSkipTLSVerify: true  # Ignores internal registry certificate errors
  moduleLoader:
    container:
      modprobe:
        moduleName: r8125
      kernelMappings:
        - regexp: '^.*$'
          containerImage: "default-route-openshift-image-registry.apps.ocp.darkloft.local/openshift-kmm/realtek-driver:v0.0.1"
  selector:
    feature.node.kubernetes.io/nic-vendor-realtek: "true"
