apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./operatorgroup.yaml
  - ./subscription.yaml
  - ./console-plugin.yaml
patches:
  - target:
      group: operator.openshift.io
      kind: Console
      name: cluster
    patch: |-
      - op: add
        path: /spec/plugins/-
        value: odf-console-plugin