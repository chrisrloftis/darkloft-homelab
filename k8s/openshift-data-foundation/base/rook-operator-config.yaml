apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-ceph-operator-config
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "5" # Applies right before the StorageCluster
data:
  # Instantly injects master tolerations into all CSI plugin infrastructures
  CSI_PLUGIN_TOLERATIONS: |
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
      
  # Instantly injects master tolerations into ALL dynamically spawned Ceph daemons (MDS, RGW, Exporters)
  ROOK_CSI_TOLERATIONS: |
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
