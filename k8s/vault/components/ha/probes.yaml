---
# Readiness probe for Vault HA cluster
# unsealed vault servers return exit code 0, sealed returns 2
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-probes
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
data:
  readiness-check.sh: |
    #!/bin/sh
    vault status -tls-skip-verify
    exit $?
---
# Liveness probe configuration via annotations on the StatefulSet
# The readiness/lifecycle hooks are already defined in the StatefulSet template.
# This ConfigMap is provided as a reference for custom probe scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-health-check
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
data:
  health-check.sh: |
    #!/bin/sh
    # Vault health endpoint returns JSON with seal_progress and initialized fields
    vault status -address=http://127.0.0.1:8200