---
# Certificate resource for Vault TLS (uses cert-manager)
# For OpenShift, you may use OpenShift's built-in certificate management instead.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
    app.kubernetes.io/name: vault
spec:
  secretName: vault-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  commonName: vault
  usages:
    - signing
    - key encipherment
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
---
# Issuer for self-signed certificates (use ClusterIssuer for production)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
spec:
  selfSigned: {}
---
# CA Issuer for signing Vault certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-ca
  labels:
    app.kubernetes.io/instance: vault
spec:
  ca:
    secretName: vault-ca-secret