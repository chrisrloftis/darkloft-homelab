---
# Default deny all traffic to/from vault namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-deny-all
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow Vault agent sidecars to communicate with Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-k8s-api
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Kubernetes API (default service IP)
    - ports:
        - protocol: TCP
          port: 443
---
# Allow inbound traffic on Vault ports (8200 for HTTP, 8201 for cluster)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-allow-ingress
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    # Allow from other Vault pods (cluster communication)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8201
        - protocol: TCP
          port: 8202
    # Allow from ingress controllers / external traffic
    - ports:
        - protocol: TCP
          port: 8200