---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: vault
    app.kubernetes.io/name: vault
    kubernetes.io/metadata.name: vault
  name: vault
---
apiVersion: v1
kind: LimitRange
metadata:
  name: vault-lr
  namespace: vault
  labels:
    app.kubernetes.io/instance: vault
spec:
  limits:
    - type: Container
      default:
        cpu: "100m"
        memory: "256Mi"
        ephemeral-storage: "512Mi"
      defaultRequest:
        cpu: "25m"
        memory: "128Mi"
        ephemeral-storage: "256Mi"