apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-console-to-gitops-cluster
  namespace: openshift-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster # Standard label for the cluster service pod
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - protocol: TCP
          port: 9001