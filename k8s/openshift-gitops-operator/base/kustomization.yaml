apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components: []
resources:
- ./namespace.yaml
- ./service-account.yaml
- ./rbac.yaml
- ./console-plugin.yaml
- ./operatorgroup.yaml
- ./network-policy.yaml
- ./subscription.yaml
patches:
  - target:
      group: operator.openshift.io
      kind: Console
      name: cluster
    patch: |-
      - op: add
        path: /spec/plugins/-
        value: gitops-plugin