apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components: []
resources:
- ./namespace.yaml
- ./service-account.yaml
- ./rbac.yaml
- ./argocd.yaml
patches:
  - target:
      version: v1
      group: operator.openshift.io
      kind: Console
      name: cluster
    patch: |-
      - op: add
        path: /spec/plugins/-
        value: openshift-gitops-plugin