apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synology-csi
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/instance: argocd
spec:
  destination:
    name: ocp.darkloft.local
    namespace: openshift-gitops
  project: default
  source:
    path: k8s/synology-csi/overlays/ocp
    repoURL: https://github.com/chrisrloftis/darkloft-homelab
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      enabled: true
      prune: true