apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  controller:
    processors: {}
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  imageUpdater:
    enabled: false
  initialSSHKnownHosts: {}
  monitoring:
    enabled: false
  networkPolicy: {}
  notifications:
    enabled: true
  extraConfig:
    notifications.data.service.webhook.discord: |
      url: $webhook
      headers:
        - name: Content-Type
          value: application/json

    notifications.data.template.discord-sync-succeeded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "✅ **Sync Succeeded** for Argo CD application **{{.app.metadata.name}}** in cluster **{{.app.spec.destination.name}}**."
            }

    notifications.data.template.discord-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "❌ **Sync Failed** for Argo CD application **{{.app.metadata.name}}**."
            }

    notifications.data.template.discord-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "⚠️ **Application Degraded!** Argo CD application **{{.app.metadata.name}}** is currently in **{{.app.status.health.status}}** state."
            }

    notifications.data.trigger.on-sync-succeeded: |
      - description: Application sync succeeded.
        oncePer: app.status.sync.revision
        send: [discord-sync-succeeded]
        when: app.status.sync.status == 'Synced'

    notifications.data.trigger.on-sync-failed: |
      - description: Application sync failed.
        oncePer: app.status.sync.revision
        send: [discord-sync-failed]
        when: app.status.sync.status == 'SyncFailed'

    notifications.data.trigger.on-health-degraded: |
      - description: Application health status is Degraded.
        send: [discord-health-degraded]
        when: app.status.health.status == 'Degraded'

    notifications.data.subscriptions: |
      - recipients:
        - webhook:discord
        triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  rbac:
    defaultPolicy: ""
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  repo:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      clusters:
      - '*'
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - apiregistration.k8s.io
      clusters:
      - '*'
      kinds:
      - APIService
    - apiGroups:
      - coordination.k8s.io
      clusters:
      - '*'
      kinds:
      - Lease
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      clusters:
      - '*'
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    - apiGroups:
      - certificates.k8s.io
      clusters:
      - '*'
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      clusters:
      - '*'
      kinds:
      - CertificateRequest
    - apiGroups:
      - cilium.io
      clusters:
      - '*'
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      clusters:
      - '*'
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ""
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex
  tls:
    ca: {}
  resourceHealthChecks:
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "InstallPlanPending" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "InstallPlan is waiting for manual approval (Overridden to Healthy)"
              return hs
            end
          end
        end
        -- Default fallback logic if it's not pending approval
        if obj.status ~= nil and obj.status.state ~= nil then
          if obj.status.state == "AtLatestKnown" or obj.status.state == "UpgradeAvailable" then
            hs.status = "Healthy"
            return hs
          end
        end
        hs.status = "Progressing"
        return hs