apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: openshift-gitops
data:
  service.webhook.discord: |
    url: $discord-token
    headers:
      - name: Content-Type
        value: application/json
  template.discord-sync-succeeded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "✅ **Sync Succeeded** for Argo CD application **{{.app.metadata.name}}** in cluster **{{.app.spec.destination.server}}**."
          }
  template.discord-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "content": "❌ **Sync Failed** for Argo CD application **{{.app.metadata.name}}**."
          }
  trigger.on-sync-succeeded: |
    - description: Application sync succeeded.
      oncePer: app.status.sync.revision
      send: [discord-sync-succeeded]
      when: app.status.sync.status == 'Synced'
  trigger.on-sync-failed: |
    - description: Application sync failed.
      oncePer: app.status.sync.revision
      send: [discord-sync-failed]
      when: app.status.sync.status == 'SyncFailed'
