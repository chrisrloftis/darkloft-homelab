apiVersion: argoproj.io/v1alpha1
kind: NotificationsConfiguration
metadata:
  name: default-notifications-configuration
  namespace: openshift-gitops
spec:
  services:
    slack: |
      token: $webhook
  
  templates:
    template.discord-sync-succeeded: |
      slack:
        attachments: |
          [
            {
              "color": "#2ecc71",
              "text": "✅ *Sync Succeeded* for Argo CD application *{{.app.metadata.name}}*."
            }
          ]
    template.discord-sync-failed: |
      slack:
        attachments: |
          [
            {
              "color": "#e74c3c",
              "text": "❌ *Sync Failed* for Argo CD application *{{.app.metadata.name}}*."
            }
          ]
    template.discord-health-degraded: |
      slack:
        attachments: |
          [
            {
              "color": "#f1c40f",
              "text": "⚠️ *Application Degraded!* Argo CD application *{{.app.metadata.name}}* is currently in *{{.app.status.health.status}}* state."
            }
          ]

  subscriptions:
    subscriptions: |
      - recipients:
        - slack:general
        triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
