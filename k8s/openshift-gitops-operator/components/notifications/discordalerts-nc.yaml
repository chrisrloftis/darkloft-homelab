apiVersion: argoproj.io/v1alpha1
kind: NotificationsConfiguration
metadata:
  name: default-notifications-configuration
  namespace: openshift-gitops
spec:
  services:
    webhook.discord: |
      url: $webhook
      headers:
        - name: Content-Type
          value: application/json
  templates:
    template.discord-sync-succeeded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "✅ **Sync Succeeded** for Argo CD application **{{.app.metadata.name}}** in cluster **{{.app.spec.destination.name}}**."
            }
    template.discord-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "❌ **Sync Failed** for Argo CD application **{{.app.metadata.name}}**."
            }
    template.discord-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "content": "⚠️ **Application Degraded!** Argo CD application **{{.app.metadata.name}}** is currently in **{{.app.status.health.status}}** state."
            }
  triggers:
    trigger.on-sync-succeeded: |
      - description: Application sync succeeded.
        oncePer: app.status?.operationState.syncResult.revision
        send: [discord-sync-succeeded]
        when: app.status?.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    trigger.on-sync-failed: |
      - description: Application sync failed.
        oncePer: app.status.sync.revision
        send: [discord-sync-failed]
        when: app.status.sync.status == 'SyncFailed'
    trigger.on-health-degraded: |
      - description: Application health status is Degraded.
        send: [discord-health-degraded]
        when: app.status.health.status == 'Degraded'
  subscriptions: |
    - recipients:
      - discord
      triggers:
      - on-sync-succeeded
      - on-sync-failed
      - on-health-degraded