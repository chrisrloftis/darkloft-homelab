apiVersion: argoproj.io/v1alpha1
kind: NotificationsConfiguration
metadata:
  name: default-notifications-configuration
  namespace: openshift-gitops
spec:
  services:
    slack: |
      # Point this directly to your Discord webhook URL, but append '/slack' to the end of it
      token: $webhook
  templates:
    template.discord-sync-succeeded: |
      slack:
        attachments: |
          [{"color": "#2ecc71", "text": "✅ *Sync Succeeded* for Argo CD application *{{.app.metadata.name}}* in cluster *{{.app.spec.destination.name}}*."}]
    template.discord-sync-failed: |
      slack:
        attachments: |
          [{"color": "#e74c3c", "text": "❌ *Sync Failed* for Argo CD application *{{.app.metadata.name}}*."}]
    template.discord-health-degraded: |
      slack:
        attachments: |
          [{"color": "#f1c40f", "text": "⚠️ *Application Degraded!* Argo CD application *{{.app.metadata.name}}* is currently in *{{.app.status.health.status}}* state."}]
  triggers:
    trigger.on-sync-succeeded: |
      - description: Application sync succeeded.
        oncePer: app.status.sync.revision
        send: [discord-sync-succeeded]
        when: app.status.sync.status == 'Synced'
    trigger.on-sync-failed: |
      - description: Application sync failed.
        oncePer: app.status.sync.revision
        send: [discord-sync-failed]
        when: app.status.sync.status == 'SyncFailed'
    trigger.on-health-degraded: |
      - description: Application health status is Degraded.
        send: [discord-health-degraded]
        when: app.status.health.status == 'Degraded'
  subscriptions:
    subscriptions: |
      - recipients:
        - slack:general
        triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
