apiVersion: v1
kind: Namespace
metadata:
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    pod-security.kubernetes.io/enforce: privileged
  name: synology-csi
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-nfs-storage
mountOptions:
- nfsvers=4.1
- hard
- rw
parameters:
  csi.storage.k8s.io/node-stage-secret-name: client-info-secret
  csi.storage.k8s.io/node-stage-secret-namespace: synology-csi
  dsm: 192.168.3.165
  location: /volume1
  nas_permissions: "0777"
  protocol: nfs
provisioner: csi.san.synology.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-smb-storage
parameters:
  csi.storage.k8s.io/node-stage-secret-name: client-info-secret
  csi.storage.k8s.io/node-stage-secret-namespace: synology-csi
  dsm: 192.168.3.165
  location: /volume1
  nasPermissions: "0777"
  protocol: smb
provisioner: csi.san.synology.com
reclaimPolicy: Delete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-controller-sa
  namespace: synology-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-node-sa
  namespace: synology-csi
---
